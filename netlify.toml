# Meridian deploys as a server-rendered Netlify app, not a static site.
#
# Nitro's netlify preset writes:
#   dist/                        static assets (hashed JS/CSS, icons, sw.js, manifest)
#   .netlify/functions-internal/ the serverless function that renders every page
#
# There is no index.html because pages are rendered per request, so publishing a
# static directory alone would serve a site with no pages. Netlify picks up the
# function automatically from .netlify/functions-internal.
#
# If Lovable's deploy settings override the values below, use the same ones there:
#   build command    bun run build
#   publish directory dist

[build]
  command = "bun run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
